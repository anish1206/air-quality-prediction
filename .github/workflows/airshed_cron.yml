name: NAICEWS Automated 6-Hour Airshed Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # Runs once a day
  workflow_dispatch:        # Manual trigger button in GitHub UI

# Grant the workflow token write access to push commits back to the repo
permissions:
  contents: write

jobs:
  run-airshed-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Use the built-in GITHUB_TOKEN so the push is authenticated
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost joblib requests requests-cache retry-requests pyarrow tqdm

      - name: Execute Operational Airshed Inference Pipeline
        timeout-minutes: 12
        run: |
          python scripts/airshed_pipeline.py

      - name: Commit and Push Updated Network Payload
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web_app/public/airshed_data.json
          # Exit 0 silently if there's nothing new to commit
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: auto-update airshed intelligence payload [skip ci]"
          git push
