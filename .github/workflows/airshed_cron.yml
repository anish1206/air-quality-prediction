name: NAICEWS Daily Airshed Pipeline

on:
  schedule:
    - cron: '30 18 * * *'   # 18:30 UTC = 00:00 IST — run at IST midnight daily
  workflow_dispatch:        # Manual trigger button in GitHub UI

# Grant the workflow token write access to push commits back to the repo
permissions:
  contents: write

jobs:
  run-airshed-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Execute Airshed Inference Pipeline
        timeout-minutes: 12
        run: python scripts/airshed_pipeline.py

      - name: Validate JSON Payload
        run: python scripts/validate_payload.py

      - name: Run Smoke Tests
        run: pytest tests/ -v --tb=short

      - name: Commit and Push Updated Payload
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web_app/public/airshed_data.json
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: auto-update airshed intelligence payload [skip ci]"
          git push
