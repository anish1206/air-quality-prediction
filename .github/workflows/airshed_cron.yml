name: NAICEWS Automated 6-Hour Airshed Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs at 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:      # Manual trigger button in GitHub UI

jobs:
  run-airshed-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost joblib requests requests-cache retry-requests pyarrow tqdm

      - name: Execute Operational Airshed Inference Pipeline
        run: |
          python scripts/airshed_pipeline.py

      - name: Commit and Push Updated Network Payload
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web_app/public/airshed_data.json
          git commit -m "Auto-update national airshed intelligence [skip ci]" || exit 0
          git push
